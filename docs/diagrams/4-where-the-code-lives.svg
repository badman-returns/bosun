<text x="60" y="66.6" font-size="28" font-weight="600" fill="#1e1e1e" xml:space="preserve">
<tspan x="60" dy="0">Where the code lives</tspan>
</text>
<text x="60" y="98.25" font-size="15" font-weight="600" fill="#868e96" xml:space="preserve">
<tspan x="60" dy="0">GitHub is the hub. You push to it, the first mates build from it, and their work comes back to it as PRs.</tspan>
</text>
<text x="82" y="235.2" font-size="16" font-weight="600" fill="#1e1e1e" xml:space="preserve">
<tspan x="82" dy="0">YOUR FOLDERS</tspan>
</text>
<text x="82" y="262.35" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">
<tspan x="82" dy="0">where you work, and plain claude sessions</tspan>
</text>
<text x="82" y="294.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="82" dy="0">~/code/work/web-app</tspan>
<tspan x="82" dy="16.25">~/code/personal/api</tspan>
<tspan x="82" dy="16.25">~/code/personal/marketing-site</tspan>
<tspan x="82" dy="16.25">~/code/personal/mobile-app</tspan>
</text>
<text x="682" y="205.2" font-size="16" font-weight="600" fill="#2f9e44" xml:space="preserve">
<tspan x="682" dy="0">GITHUB</tspan>
</text>
<text x="682" y="232.35" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">
<tspan x="682" dy="0">the hub; each repo has its default branch</tspan>
</text>
<text x="682" y="264.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="682" dy="0">work-org/web-app: development</tspan>
<tspan x="682" dy="16.25">you/api: main</tspan>
<tspan x="682" dy="16.25">you/marketing-site: main</tspan>
<tspan x="682" dy="16.25">you/mobile-app: master</tspan>
</text>
<text x="1362" y="185.2" font-size="16" font-weight="600" fill="#1e1e1e" xml:space="preserve">
<tspan x="1362" dy="0">FIRST MATE COPIES</tspan>
</text>
<text x="1382" y="240.2" font-size="16" font-weight="600" fill="#6741d9" xml:space="preserve">
<tspan x="1382" dy="0">main session</tspan>
</text>
<text x="1382" y="275.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="1382" dy="0">~/Documents/firstmate/projects</tspan>
</text>
<text x="1382" y="335.2" font-size="16" font-weight="600" fill="#6741d9" xml:space="preserve">
<tspan x="1382" dy="0">named sessions (web-app, api ...)</tspan>
</text>
<text x="1382" y="370.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="1382" dy="0">firstmate-sessions/&lt;name&gt;/projects</tspan>
</text>
<text x="2002" y="235.2" font-size="16" font-weight="600" fill="#6741d9" xml:space="preserve">
<tspan x="2002" dy="0">WORKERS</tspan>
</text>
<text x="2002" y="262.35" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">
<tspan x="2002" dy="0">one per task, in its own herdr tab</tspan>
</text>
<text x="2002" y="294.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="2002" dy="0">a treehouse worktree per task,</tspan>
<tspan x="2002" dy="16.25">branched from the default branch</tspan>
<tspan x="2002" dy="16.25">of the first mate&#x27;s copy</tspan>
</text>
<text x="2002" y="535.2" font-size="16" font-weight="600" fill="#f08c00" xml:space="preserve">
<tspan x="2002" dy="0">NO-MISTAKES</tspan>
</text>
<text x="2002" y="562.35" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">
<tspan x="2002" dy="0">the only road back to GitHub</tspan>
</text>
<text x="2002" y="594.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="2002" dy="0">rebase on the default branch</tspan>
<tspan x="2002" dy="16.25">review, end-to-end test,</tspan>
<tspan x="2002" dy="16.25">screenshots or recordings</tspan>
</text>
<text x="452" y="251.1" font-size="13" font-weight="400" fill="#1971c2" xml:space="preserve">
<tspan x="452" dy="0">1  git push</tspan>
</text>
<text x="452" y="392.35" font-size="13" font-weight="400" fill="#1971c2" xml:space="preserve">
<tspan x="452" dy="0">5  merge the PR,</tspan>
<tspan x="452" dy="16.25">   then git pull</tspan>
</text>
<text x="1132" y="219.85" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">
<tspan x="1132" dy="0">2  every fm start:</tspan>
<tspan x="1132" dy="16.25">   fetch + fast-forward</tspan>
</text>
<text x="1772" y="286.1" font-size="13" font-weight="400" fill="#6741d9" xml:space="preserve">
<tspan x="1772" dy="0">3  a worktree per task</tspan>
</text>
<text x="2182" y="443.9" font-size="12" font-weight="400" fill="#6741d9" xml:space="preserve">
<tspan x="2182" dy="0">3  git push no-mistakes</tspan>
</text>
<text x="960" y="596.4" font-size="12" font-weight="400" fill="#2f9e44" xml:space="preserve">
<tspan x="960" dy="0">4  PR on GitHub: intent, what changed, risk, evidence</tspan>
</text>
<text x="78" y="493.4" font-size="12" font-weight="400" fill="#1971c2" xml:space="preserve">
<tspan x="78" dy="0">Anything only in your folder (uncommitted files, unpushed</tspan>
<tspan x="78" dy="15">commits) is invisible to the first mate. Push it first.</tspan>
</text>
<text x="84" y="637.2" font-size="16" font-weight="600" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">WHAT HAPPENS WHEN</tspan>
</text>
<text x="84" y="678.35" font-size="13" font-weight="400" fill="#1971c2" xml:space="preserve">
<tspan x="84" dy="0">2     YOU PUSH</tspan>
</text>
<text x="84" y="702.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">Your own work goes to GitHub first; the first mate never reads your folder.</tspan>
</text>
<text x="84" y="738.6" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">
<tspan x="84" dy="0">1     A FIRST MATE STARTS</tspan>
</text>
<text x="84" y="762.6" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">Each session refreshes its own copies from each repo&#x27;s default branch.</tspan>
</text>
<text x="84" y="798.85" font-size="13" font-weight="400" fill="#6741d9" xml:space="preserve">
<tspan x="84" dy="0">3     WORKERS</tspan>
</text>
<text x="84" y="822.85" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">One worktree per task, branched from that default branch.</tspan>
</text>
<text x="84" y="859.1" font-size="13" font-weight="400" fill="#2f9e44" xml:space="preserve">
<tspan x="84" dy="0">4     GATE</tspan>
</text>
<text x="84" y="883.1" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">no-mistakes rebases, reviews, tests, records evidence, and opens the PR.</tspan>
</text>
<text x="84" y="919.35" font-size="13" font-weight="400" fill="#1971c2" xml:space="preserve">
<tspan x="84" dy="0">2     YOU MERGE</tspan>
</text>
<text x="84" y="943.35" font-size="13" font-weight="400" fill="#1e1e1e" xml:space="preserve">
<tspan x="84" dy="0">Merge the PR on GitHub, then git pull in your folder to have it locally.</tspan>
</text>
</svg>
